<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Research to Reality newsletter issue: Issue 1">
  <meta name="theme-color" content="#071a18">
  <title>Issue 1 | Research to Reality</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg:#071a18; --panel:#0d2622; --text:#f3f7f6; --muted:#b7c8c4; --accent:#65d7bc; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'DM Sans',sans-serif; background:linear-gradient(180deg,#071a18,#0b211e); color:var(--text); }
    a { color:inherit; }
    .topbar { position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:1rem clamp(1rem,4vw,3rem); background:rgba(7,26,24,.94); border-bottom:1px solid rgba(255,255,255,.08); backdrop-filter:blur(12px); }
    .brand { font-family:'Manrope',sans-serif; font-weight:800; text-decoration:none; }
    .back { color:var(--muted); text-decoration:none; }
    .back:hover { color:var(--accent); }
    main { width:min(1280px,94vw); margin:0 auto; padding:clamp(1.5rem,4vw,4rem) 0 3rem; }
    .hero { display:grid; grid-template-columns:minmax(220px,360px) 1fr; gap:clamp(1.5rem,4vw,4rem); align-items:center; margin-bottom:2rem; }
    .cover { width:100%; max-height:520px; object-fit:contain; border-radius:18px; background:#fff; box-shadow:0 22px 60px rgba(0,0,0,.35); }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.14em; font-weight:700; font-size:.82rem; }
    h1 { margin:.4rem 0 1rem; font-family:'Manrope',sans-serif; font-size:clamp(2.2rem,5vw,4.5rem); line-height:1.02; }
    .lede { color:var(--muted); font-size:1.08rem; max-width:62ch; }
    .actions { display:flex; flex-wrap:wrap; gap:.8rem; margin-top:1.5rem; }
    .button { display:inline-flex; align-items:center; justify-content:center; padding:.85rem 1.15rem; border-radius:999px; text-decoration:none; font-weight:700; border:1px solid rgba(255,255,255,.18); }
    .primary { background:var(--accent); color:#06201c; border-color:transparent; }
    .secondary { background:rgba(255,255,255,.05); }
    .viewer { overflow:hidden; border-radius:18px; background:#fff; box-shadow:0 22px 60px rgba(0,0,0,.35); min-height:75vh; }
    .viewer iframe, .viewer object { width:100%; height:82vh; min-height:720px; border:0; display:block; }
    .fallback { color:#17211f; padding:2rem; }
    footer { color:var(--muted); text-align:center; padding:2rem 1rem 3rem; }
    @media (max-width:800px) {
      .hero { grid-template-columns:1fr; }
      .cover { max-height:420px; }
      .viewer iframe, .viewer object { min-height:580px; height:72vh; }
    }
    .header-buttons{
      margin-right:100px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../home.html">Research to Reality</a>
    <a class="back" href="../../home.html">Back to home</a>
  </header>
  <main>
    <section class="hero">
      <img class="cover" src="image.png" alt="Cover image for Issue 1 of Research to Reality">
      <div>
        <p class="eyebrow">Research to Reality Newsletter</p>
        <h1>Issue 1</h1>
        <p class="lede">Read the complete issue below or download the PDF for offline reading.</p>
        <div class="actions">
          <a class="button primary" href="NewsLetter.pdf" download>Download PDF</a>
          <a class="button secondary" href="NewsLetter.pdf" target="_blank" rel="noopener">Open PDF in a new tab</a>
        </div>
      </div>
    </section>
    <section class="viewer" aria-label="Embedded PDF viewer for Issue 1">
      <object data="NewsLetter.pdf" type="application/pdf">
        <iframe src="NewsLetter.pdf" title="Issue 1 newsletter PDF"></iframe>
        <p class="fallback">Your browser cannot display this PDF. <a href="NewsLetter.pdf" download>Download the issue instead.</a></p>
      </object>
    </section>
  </main>
  <footer>© 2026 Jeffrey Alan Young · Research to Reality</footer>
</body>
</html>
